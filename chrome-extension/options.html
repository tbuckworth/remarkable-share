<!DOCTYPE html>
<html>
<head>
<style>
  body { width: 400px; padding: 20px; font-family: system-ui, sans-serif; font-size: 14px; }
  h2 { margin: 0 0 16px; font-size: 18px; }
  h3 { margin: 16px 0 8px; font-size: 14px; }
  label { font-weight: 600; display: block; margin-bottom: 4px; font-size: 13px; }
  input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; font-family: monospace; }
  .hint { font-size: 12px; color: #888; margin: 4px 0 8px; }
  button { padding: 8px 20px; background: #111; color: white; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; margin-top: 8px; }
  button:hover { background: #333; }
  button:disabled { background: #999; }
  .status { margin-top: 10px; padding: 8px; border-radius: 4px; font-size: 13px; }
  .status.success { background: #dcfce7; color: #166534; }
  .status.error { background: #fef2f2; color: #991b1b; }
  .divider { border-top: 1px solid #ddd; margin: 16px 0; }
  #resetSection { display: none; }
  .danger { background: #dc2626; }
  .danger:hover { background: #b91c1c; }
</style>
</head>
<body>
  <h2>Send to reMarkable — Setup</h2>

  <div id="codeSection">
    <h3>Option 1: Register with code</h3>
    <div class="hint">Go to <a href="https://my.remarkable.com/device/desktop/connect" target="_blank">my.remarkable.com</a> and get a one-time code.</div>
    <label for="code">8-character code</label>
    <input type="text" id="code" placeholder="abcd1234" maxlength="8">
    <button id="register">Connect</button>

    <div class="divider"></div>

    <h3>Option 2: Paste existing token</h3>
    <div class="hint">Copy <code>devicetoken</code> from <code>~/.config/rmapi/rmapi.conf</code></div>
    <label for="existingToken">Device token</label>
    <input type="password" id="existingToken" placeholder="eyJ...">
    <button id="pasteToken">Save Token</button>
  </div>

  <div id="resetSection">
    <button id="reset" class="danger">Disconnect / Reset Token</button>
  </div>

  <div class="status" id="status"></div>

  <script src="dist/options.js"></script>
</body>
</html>
